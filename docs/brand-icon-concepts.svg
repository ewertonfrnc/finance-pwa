<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title description">
  <title id="title">Estudo de símbolos para a marca do Finance</title>
  <desc id="description">Quatro alternativas de símbolo ligadas a tempo, margem e previsão, comparadas em cor, uma cor e 24 pixels.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0d3f38" flood-opacity="0.08" />
    </filter>

    <symbol id="horizon" viewBox="0 0 64 64">
      <circle cx="13" cy="32" r="4" fill="currentColor" />
      <path d="M17 32C22 18 28 18 32 32C36 46 42 46 47 32" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="51" cy="32" r="4" fill="currentColor" />
    </symbol>

    <symbol id="corridor" viewBox="0 0 64 64">
      <circle cx="13" cy="32" r="4" fill="currentColor" />
      <path d="M20 23C29 23 36 28 48 28" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
      <path d="M20 41C29 41 36 36 48 36" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
      <path d="M51 18V46" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
    </symbol>

    <symbol id="bridge" viewBox="0 0 64 64">
      <path d="M14 40C20 17 44 17 50 40" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
      <circle cx="14" cy="40" r="4" fill="currentColor" />
      <circle cx="50" cy="40" r="4" fill="currentColor" />
    </symbol>

    <symbol id="interval" viewBox="0 0 64 64">
      <path d="M18 43A21 21 0 1 1 47 42" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
      <circle cx="18" cy="43" r="4" fill="currentColor" />
      <circle cx="47" cy="42" r="4" fill="currentColor" />
    </symbol>

    <style>
      .canvas { fill: #f3eee4; }
      .ink { fill: #0d3f38; }
      .muted { fill: #65736e; }
      .eyebrow { fill: #41665d; font-size: 13px; font-weight: 750; letter-spacing: 2.2px; }
      .title { fill: #0d3f38; font-size: 46px; font-weight: 760; letter-spacing: -1.4px; }
      .intro { fill: #52655f; font-size: 19px; font-weight: 450; }
      .card { fill: #fbf8f2; stroke: #ded8cc; stroke-width: 1; }
      .card-recommended { stroke: #0d3f38; stroke-width: 3; }
      .letter { fill: #0d3f38; font-size: 13px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
      .card-title { fill: #0d3f38; font-size: 25px; font-weight: 760; letter-spacing: -0.3px; }
      .body { fill: #53645f; font-size: 16px; font-weight: 450; }
      .sample-label { fill: #75817d; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .chip { fill: #e0f7a6; }
      .chip-text { fill: #244d30; font-size: 12px; font-weight: 800; letter-spacing: 0.8px; }
      .footer-title { fill: #f8f3e9; font-size: 26px; font-weight: 760; }
      .footer-body { fill: #c7d1ca; font-size: 17px; font-weight: 450; }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="canvas" width="1440" height="980" />

  <text x="72" y="75" class="eyebrow">ESTUDO DE MARCA · SÍMBOLOS</text>
  <text x="72" y="130" class="title">Previsão sem promessa de crescimento</text>
  <text x="72" y="170" class="intro">Quatro caminhos para representar tempo, margem e controle sem recorrer aos clichês visuais de finanças.</text>

  <!-- A: Horizon -->
  <g filter="url(#shadow)">
    <rect x="72" y="222" width="300" height="574" rx="28" class="card card-recommended" />
  </g>
  <circle cx="108" cy="264" r="17" fill="#e0f7a6" />
  <text x="108" y="265" class="letter">A</text>
  <text x="136" y="272" class="card-title">Trajeto</text>
  <rect x="256" y="246" width="92" height="28" rx="14" class="chip" />
  <text x="272" y="265" class="chip-text">ESCOLHIDA</text>
  <text x="96" y="316" class="body">
    <tspan x="96" dy="0">Dois pontos e uma variação</tspan>
    <tspan x="96" dy="23">neutra entre hoje e o fim.</tspan>
  </text>
  <rect x="126" y="386" width="192" height="192" rx="45" fill="#0d3f38" />
  <g color="#c8f76a">
    <use href="#horizon" x="158" y="418" width="128" height="128" />
  </g>
  <text x="96" y="628" class="sample-label">UMA COR</text>
  <rect x="96" y="648" width="76" height="76" rx="18" fill="#e8e3d9" />
  <g color="#0d3f38">
    <use href="#horizon" x="110" y="662" width="48" height="48" />
  </g>
  <text x="206" y="628" class="sample-label">24 PX</text>
  <rect x="206" y="648" width="76" height="76" rx="18" fill="#0d3f38" />
  <g color="#c8f76a">
    <use href="#horizon" x="232" y="674" width="24" height="24" />
  </g>
  <text x="96" y="757" class="body">Risco: lembrar conexão ou fluxo.</text>

  <!-- B: Corridor -->
  <g filter="url(#shadow)">
    <rect x="404" y="222" width="300" height="574" rx="28" class="card" />
  </g>
  <circle cx="440" cy="264" r="17" fill="#e0f7a6" />
  <text x="440" y="265" class="letter">B</text>
  <text x="468" y="272" class="card-title">Margem</text>
  <text x="428" y="316" class="body">
    <tspan x="428" dy="0">As bordas tornam visível</tspan>
    <tspan x="428" dy="23">a margem que ainda existe.</tspan>
  </text>
  <rect x="458" y="386" width="192" height="192" rx="45" fill="#0d3f38" />
  <g color="#c8f76a">
    <use href="#corridor" x="490" y="418" width="128" height="128" />
  </g>
  <text x="428" y="628" class="sample-label">UMA COR</text>
  <rect x="428" y="648" width="76" height="76" rx="18" fill="#e8e3d9" />
  <g color="#0d3f38">
    <use href="#corridor" x="442" y="662" width="48" height="48" />
  </g>
  <text x="538" y="628" class="sample-label">24 PX</text>
  <rect x="538" y="648" width="76" height="76" rx="18" fill="#0d3f38" />
  <g color="#c8f76a">
    <use href="#corridor" x="564" y="674" width="24" height="24" />
  </g>
  <text x="428" y="757" class="body">Risco: precisa evitar leitura de funil.</text>

  <!-- C: Bridge -->
  <g filter="url(#shadow)">
    <rect x="736" y="222" width="300" height="574" rx="28" class="card" />
  </g>
  <circle cx="772" cy="264" r="17" fill="#e0f7a6" />
  <text x="772" y="265" class="letter">C</text>
  <text x="800" y="272" class="card-title">Ponte</text>
  <text x="760" y="316" class="body">
    <tspan x="760" dy="0">Dois pontos sustentam um</tspan>
    <tspan x="760" dy="23">período, sem indicar alta.</tspan>
  </text>
  <rect x="790" y="386" width="192" height="192" rx="45" fill="#0d3f38" />
  <g color="#c8f76a">
    <use href="#bridge" x="822" y="418" width="128" height="128" />
  </g>
  <text x="760" y="628" class="sample-label">UMA COR</text>
  <rect x="760" y="648" width="76" height="76" rx="18" fill="#e8e3d9" />
  <g color="#0d3f38">
    <use href="#bridge" x="774" y="662" width="48" height="48" />
  </g>
  <text x="870" y="628" class="sample-label">24 PX</text>
  <rect x="870" y="648" width="76" height="76" rx="18" fill="#0d3f38" />
  <g color="#c8f76a">
    <use href="#bridge" x="896" y="674" width="24" height="24" />
  </g>
  <text x="760" y="757" class="body">Risco: parecer conexão ou cobertura.</text>

  <!-- D: Interval -->
  <g filter="url(#shadow)">
    <rect x="1068" y="222" width="300" height="574" rx="28" class="card" />
  </g>
  <circle cx="1104" cy="264" r="17" fill="#e0f7a6" />
  <text x="1104" y="265" class="letter">D</text>
  <text x="1132" y="272" class="card-title">Intervalo</text>
  <text x="1092" y="316" class="body">
    <tspan x="1092" dy="0">O trecho aberto é o mês</tspan>
    <tspan x="1092" dy="23">que ainda não aconteceu.</tspan>
  </text>
  <rect x="1122" y="386" width="192" height="192" rx="45" fill="#0d3f38" />
  <g color="#c8f76a">
    <use href="#interval" x="1154" y="418" width="128" height="128" />
  </g>
  <text x="1092" y="628" class="sample-label">UMA COR</text>
  <rect x="1092" y="648" width="76" height="76" rx="18" fill="#e8e3d9" />
  <g color="#0d3f38">
    <use href="#interval" x="1106" y="662" width="48" height="48" />
  </g>
  <text x="1202" y="628" class="sample-label">24 PX</text>
  <rect x="1202" y="648" width="76" height="76" rx="18" fill="#0d3f38" />
  <g color="#c8f76a">
    <use href="#interval" x="1228" y="674" width="24" height="24" />
  </g>
  <text x="1092" y="757" class="body">Risco: lembrar progresso ou sincronização.</text>

  <rect x="72" y="838" width="1296" height="106" rx="25" fill="#0d3f38" />
  <text x="104" y="882" class="footer-title">Direção selecionada: Trajeto</text>
  <text x="104" y="915" class="footer-body">É a relação mais direta entre hoje e o fim do período, sem alta, queda ou seta como mensagem principal.</text>
  <text x="104" y="937" class="footer-body">A onda pode virar uma linguagem própria para previsão, estados do mês e motion sem depender de um clichê financeiro.</text>
</svg>
