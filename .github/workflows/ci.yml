name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun ci

      - name: Start local Postgres
        run: bunx supabase db start

      - name: Reset local database
        run: bunx supabase db reset

      - name: Test database
        run: bunx supabase test db

      - name: Verify generated database types
        run: |
          bun run db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts

      - name: Check code style
        run: bun run check

      - name: Check TypeScript
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bun run test

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run browser tests
        run: bun run test:e2e

      - name: Build production application
        run: bun run build

      - name: Stop local Supabase
        if: always()
        run: bunx supabase stop --no-backup
